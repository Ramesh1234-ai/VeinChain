services:
  - type: web
    name: veinchain-backend
    runtime: python
    runtimeVersion: 3.11
    buildCommand: "pip install -r Backend/requirements.txt && Backend/db_setup.sh"
    startCommand: "cd Backend && gunicorn --workers 4 --worker-class sync --timeout 120 --bind 0.0.0.0:$PORT app:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        scope: engine
      - key: SECRET_KEY
        scope: engine
      - key: JWT_SECRET_KEY
        scope: engine
      - key: EMAIL_USER
        scope: engine
      - key: EMAIL_PASS
        scope: engine
      - key: CORS_ORIGINS
        value: "https://yourdomain.com"
      - key: SESSION_COOKIE_SECURE
        value: "True"

databases:
  - name: veinchain-db
    databaseName: veinchain
    user: veinchain_user
    plan: standard
    region: oregon

env:
  - from_file: Backend/.env.production
